stages:
  - deploy

deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  only:
    - production
  before_script:
    - apk add --no-cache openssh git curl
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST_NODE_BACKEND" >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to EC2 $EC2_HOST_NODE_BACKEND..."
    - |
      ssh ubuntu@$EC2_HOST_NODE_BACKEND "
        set -e
        echo '📁 Changing to project directory...'
        cd /home/ubuntu/node-backend

        echo '🔁 Switching to production branch...'
        git checkout production

        echo '🔄 Pulling latest code...'
        git reset --hard HEAD
        git clean -fd
        git pull origin production

        echo '📦 Installing dependencies...'
        export NVM_DIR=\$HOME/.nvm
        [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
        [ -s \"\$NVM_DIR/bash_completion\" ] && \. \"\$NVM_DIR/bash_completion\"
        nvm use 22

        npm install && npm run clean && npm run compile

        echo '🚀 Restarting PM2 process: node-backend...'
        npx pm2 restart node-backend || npx pm2 start npm --name node-backend -- run start

        echo '✅ Deployment complete.'
      "
